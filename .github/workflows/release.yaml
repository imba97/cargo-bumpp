name: Release

# Publishing is not idempotent: a crate name and version pair can never be
# reused, and a yanked version cannot be un-yanked. So this workflow is written
# to refuse rather than to guess, and it is safe to re-run after a partial
# failure because publishing a version that is already on the registry counts as
# done rather than as an error.
#
# The checks live in ci.yaml, which this workflow calls. Keeping them in one run
# is what makes the order structural.

on:
  push:
    # The one and only trigger: `v<major>.<minor>.<patch>` tags, i.e. exactly
    # the tags `cargo bumpp` creates. Nothing else starts a run, so nothing else
    # can reach the registry, and the shape of a release tag is enforced here
    # rather than by a script that has to remember to check it.
    tags: [ "v*.*.*" ]

# Read-only by default; the publishing job asks for nothing more.
permissions:
  contents: read

jobs:
  # Everything that can be checked without credentials: formatting, clippy, the
  # test suite on three platforms, rustdoc, `cargo package`, the empty
  # dependency tree, and the MSRV build. Calling the whole file means publish
  # waits for every job in it, matrix included, without listing them here.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yaml

  # ---------------------------------------------------------------------------
  # crates.io. One crate, no dependencies, so there is no dependency order to
  # respect and no index propagation to wait for.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to crates.io
    needs: [ checks ]
    runs-on: ubuntu-latest
    # No `if:` needed: a tag push is the only way in, so reaching this job at all
    # means a release was asked for, and `needs` means the checks have passed.
    #
    # No `environment:` either, on purpose. Declaring one moves the secret into
    # environment scope and requires that environment to exist before the first
    # run, for a gate this project does not need yet; the token is read from
    # Settings -> Secrets and variables -> Actions instead. To add a manual
    # approval gate later, create the environment, add `environment: <name>`
    # back and move the secret into it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # No `rust-cache` in this job on purpose. It has no dependencies to cache,
      # `cargo publish` verifies the crate in seconds, and restoring the test
      # job's cache is what made this job report cleanup errors about a
      # `target/package/` tree it never created.

      # The release tool. Everything this job used to work out in shell -- the tag
      # check, the token check, and the publish loop -- is one `harbor` command.
      - name: Install the release tool
        run: cargo install harbor --locked

      # Two guards and a plan, in one command: the tag names the version in the
      # manifest, a registry token is present and non-empty, and the release plan
      # is computable at all. Nothing is uploaded until all three hold.
      #
      # The token is passed through the environment and never as an argument, so it
      # cannot reach a log by way of cargo echoing a command line.
      - name: Check the release before starting it
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo harbor check --plan "$GITHUB_REF_NAME"

      # `harbor publish` replaces what used to be here: `cargo publish` wrapped in a
      # branch that grepped the output. It retries when a dependency is not indexed
      # yet, treats a version that is already on the registry as done so a re-run
      # finishes a partial release, and stops at once on anything else rather than
      # spending a retry budget on a failure a retry cannot fix.
      #
      # No `--order`: this crate is one package with no `publish = false`, so the
      # plan `check --plan` just computed is the whole answer.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo harbor publish
